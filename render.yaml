services:
  - type: web
    name: whatsapp-ai-bot
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node --max-old-space-size=320 server.mjs
    healthCheckPath: /health
    envVars:
      - key: ADMIN_SECRET
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "openrouter/free"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: "whatsapp_bot"
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_ACTIVE_WA_SESSIONS
        value: "5"
