services:
  - type: web
    name: whatsapp-ai-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "openrouter/free"
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SYSTEM_PROMPT
        value: "You are a helpful, professional, and friendly AI assistant. Answer concisely with clean formatting (*bold*, _italic_, bullet points, emojis). Avoid markdown hashtags."
